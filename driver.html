<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Conductor · SEU</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="page" hidden>
    <header class="page-head">
      <div>
        <p class="eyebrow"><a href="drivers.html">Conductores</a></p>
        <h1 id="title">Conductor</h1>
      </div>
      <div id="badges" class="actions"></div>
    </header>
    <div id="detail"><p class="state">Cargando…</p></div>
  </main>
  <script src="js/format.js"></script>
  <script src="js/session.js"></script>
  <script src="js/api.js"></script>
  <script>
    if (!Session.mount('drivers')) throw new Error('sin sesión');
    const id = Session.query().get('id');
    const root = document.getElementById('detail');

    const DOC = {
      cc: 'Cédula de ciudadanía',
      ce: 'Cédula de extranjería',
      passport: 'Pasaporte',
      ppt: 'PPT',
    };
    const CLASSIFICATION = {
      classified: 'Clasificado por el catálogo',
      default_normal: 'Normal, no está en el catálogo',
      version_required: 'Falta la versión',
      too_old: 'Supera los 15 años',
    };

    function locationLine(point) {
      if (!point) return '—';
      const href = `https://www.openstreetmap.org/?mlat=${encodeURIComponent(point.lat)}&mlon=${encodeURIComponent(point.lng)}`;
      return `<a href="${href}" target="_blank" rel="noopener">${Fmt.esc(point.lat)}, ${Fmt.esc(point.lng)}</a><br><span class="hint">${Fmt.esc(Fmt.when(point.at))}</span>`;
    }

    function day(value) {
      if (!value) return '—';
      const match = String(value).match(/^(\d{4}-\d{2}-\d{2})/);
      if (!match) return Fmt.when(value);
      const date = new Date(`${match[1]}T12:00:00-05:00`);
      return new Intl.DateTimeFormat('es-CO', {
        timeZone: 'America/Bogota',
        year: 'numeric',
        month: 'short',
        day: 'numeric',
      }).format(date);
    }

    function shot(url, label) {
      if (!url) return '';
      const src = Api.fileUrl(url);
      return `<figure class="shot"><a href="${Fmt.esc(src)}" target="_blank" rel="noopener"><img src="${Fmt.esc(src)}" alt="${Fmt.esc(label)}"></a><figcaption>${Fmt.esc(label)}</figcaption></figure>`;
    }

    function shots(items) {
      const html = items.map(([url, label]) => shot(url, label)).join('');
      return html ? `<div class="shots">${html}</div>` : '';
    }

    function applicationBlock(app, status) {
      if (!app) return '';
      const car = app.vehicle;
      const emergency = app.emergency;
      const payout = app.payout;
      const versionLine = car
        ? (car.version ? car.version : (car.versionRequired ? 'No la envió' : 'Sin versión'))
        : '—';
      const known = car && car.knownVersions && car.knownVersions.length
        ? car.knownVersions.join(', ')
        : '';
      const ceiling = car && car.catalogMax && car.catalogMax !== car.category
        ? ` · tope ${Fmt.category(car.catalogMax)}`
        : '';
      let banner = '';
      if (status === 'draft') {
        banner = '<p class="callout">El registro está en borrador. El conductor todavía no lo envió, así que no se puede aprobar.</p>';
      } else if (status === 'pending' && car) {
        banner = '<p class="callout quiet">Al aprobar, el servidor crea este vehículo y lo deja asignado. No hace falta cargarlo otra vez.</p>';
      }
      const versionNote = car && car.versionRequired
        ? `<p class="callout">Pidió el modelo sin versión. Falta confirmarla para Comfort o Premium; el carro queda en Normal.${known ? ` Versiones del catálogo: ${Fmt.esc(known)}.` : ''}</p>`
        : '';
      const account = !payout
        ? '<p class="hint">Todavía no cargó la cuenta.</p>'
        : payout.method === 'bank'
          ? `<dl class="facts">
              <div><dt>Medio</dt><dd>Cuenta bancaria</dd></div>
              <div><dt>Banco</dt><dd>${Fmt.text(payout.bank)}</dd></div>
              <div><dt>Tipo</dt><dd>${Fmt.text(payout.accountType)}</dd></div>
              <div><dt>Número</dt><dd>${Fmt.text(payout.accountNumber)}</dd></div>
              <div><dt>Titular</dt><dd>${Fmt.text(payout.holder)}</dd></div>
            </dl>`
          : '<dl class="facts"><div><dt>Medio</dt><dd>Billetera</dd></div></dl>';
      return `
        <section class="card">
          <h2>Solicitud</h2>
          ${banner}
          <h3>Identidad</h3>
          <dl class="facts">
            <div><dt>Documento</dt><dd>${Fmt.esc(DOC[app.documentType] || app.documentType || '—')}${app.document ? `<br>${Fmt.text(app.document)}` : ''}</dd></div>
            <div><dt>Complemento</dt><dd>${Fmt.text(app.documentExtra)}</dd></div>
            <div><dt>Nacimiento</dt><dd>${Fmt.esc(day(app.birthDate))}</dd></div>
            <div><dt>Dirección</dt><dd>${Fmt.text(app.address)}</dd></div>
          </dl>
          ${shots([
            [app.selfieUrl, 'Selfie'],
            [app.documentFrontUrl, 'Documento, frente'],
            [app.documentBackUrl, 'Documento, reverso'],
            [app.backgroundCheckUrl, 'Antecedentes'],
          ])}
          <h3>Licencia</h3>
          <dl class="facts">
            <div><dt>Número</dt><dd>${Fmt.text(app.licenseNumber)}</dd></div>
            <div><dt>Categoría</dt><dd>${Fmt.text(app.licenseClass)}</dd></div>
            <div><dt>Vence</dt><dd>${Fmt.esc(day(app.licenseExpiry))}</dd></div>
          </dl>
          ${shots([
            [app.licenseFrontUrl, 'Licencia, frente'],
            [app.licenseBackUrl, 'Licencia, reverso'],
          ])}
          <h3>Vehículo</h3>
          ${car ? `
            <dl class="facts">
              <div><dt>Placa</dt><dd>${Fmt.text(car.plate)}</dd></div>
              <div><dt>Marca y modelo</dt><dd>${Fmt.text(car.brand)} ${Fmt.text(car.model)}</dd></div>
              <div><dt>Año</dt><dd>${Fmt.text(car.year)}</dd></div>
              <div><dt>Color</dt><dd>${Fmt.text(car.color)}</dd></div>
              <div><dt>Categoría</dt><dd>${Fmt.esc(Fmt.category(car.category))}${Fmt.esc(ceiling)}</dd></div>
              <div><dt>Edad</dt><dd>${car.age == null ? '—' : `${Fmt.esc(car.age)} años`}</dd></div>
              <div><dt>Versión</dt><dd>${Fmt.esc(versionLine)}</dd></div>
              <div><dt>Uso</dt><dd>${car.modality === 'taxi' ? 'Taxi' : 'Particular'}${car.seats ? ` · ${Fmt.esc(car.seats)} puestos` : ''}</dd></div>
            </dl>
            <p class="hint">${Fmt.esc(CLASSIFICATION[car.classificationStatus] || car.classificationStatus || '')}</p>
            ${versionNote}
            <dl class="facts">
              <div><dt>SOAT vence</dt><dd>${Fmt.esc(day(car.soatExpiresAt))}</dd></div>
              <div><dt>Tecnomecánica vence</dt><dd>${Fmt.esc(day(car.techReviewExpiresAt))}</dd></div>
            </dl>
            ${shots([
              [car.frontUrl, 'Vehículo, frente'],
              [car.rearUrl, 'Vehículo, atrás'],
              [car.ownershipUrl, 'Propiedad'],
              [car.circulationUrl, 'Tarjeta de circulación'],
              [car.soatUrl, 'SOAT'],
              [car.techReviewUrl, 'Tecnomecánica'],
            ])}
          ` : '<p class="hint">Todavía no cargó el vehículo.</p>'}
          <h3>Emergencia</h3>
          ${emergency ? `
            <dl class="facts">
              <div><dt>Nombre</dt><dd>${Fmt.text(emergency.name)}</dd></div>
              <div><dt>Parentesco</dt><dd>${Fmt.text(emergency.relationship)}</dd></div>
              <div><dt>Teléfono</dt><dd>${Fmt.text(emergency.phone)}</dd></div>
            </dl>
          ` : '<p class="hint">Todavía no cargó el contacto.</p>'}
          <h3>Cuenta</h3>
          ${account}
        </section>
      `;
    }

    function render(driver) {
      document.getElementById('title').textContent = driver.fullName || 'Conductor';
      document.title = `${driver.fullName || 'Conductor'} · SEU`;
      document.getElementById('badges').innerHTML = `${Fmt.driver(driver.status)} ${Fmt.operational(driver.operational)}`;
      const vehicles = (driver.vehicles || []).map((item) => (
        `<li>${Fmt.text(item.plate)} · ${Fmt.text(item.brand)} ${Fmt.text(item.model)} · ${Fmt.esc(Fmt.category(item.category))} · ${Fmt.vehicle(item.status)}</li>`
      )).join('') || '<li>Sin vehículos</li>';
      const trip = driver.activeTripId
        ? `<a href="trip.html?id=${encodeURIComponent(driver.activeTripId)}">Ver viaje activo</a>`
        : '—';
      let statusAction = '<p class="hint">Pendiente, rechazado o suspendido se cambia con la revisión.</p>';
      if (driver.status === 'draft') {
        statusAction = '<p class="hint">El borrador no se aprueba ni se activa. El conductor tiene que enviar el registro.</p>';
      } else if (driver.status === 'approved') {
        statusAction = '<button class="btn ghost" type="submit" data-status="inactive">Desactivar</button>';
      } else if (driver.status === 'inactive') {
        statusAction = '<button class="btn" type="submit" data-status="active">Activar</button>';
      }
      const approveButton = driver.status === 'draft'
        ? ''
        : '<button class="btn" type="submit" data-action="approve">Aprobar</button>';
      root.innerHTML = `
        <section class="card">
          <dl class="facts">
            <div><dt>Documento</dt><dd>${Fmt.text(driver.document)}</dd></div>
            <div><dt>Correo</dt><dd>${Fmt.text(driver.email)}</dd></div>
            <div><dt>Teléfono</dt><dd>${Fmt.text(driver.phone)}</dd></div>
            <div><dt>Ciudad</dt><dd>${Fmt.text(driver.city)}</dd></div>
            <div><dt>País</dt><dd>${Fmt.text(driver.countryCode)}</dd></div>
            <div><dt>Calificación</dt><dd>${Fmt.esc(Fmt.rating(driver.ratingAvg, driver.ratingCount))}</dd></div>
            <div><dt>Deuda en efectivo</dt><dd>${Fmt.esc(Fmt.money(driver.cashCommissionOwed, Fmt.currencyFor(driver.countryCode)))}<br><a href="commission.html?driverId=${encodeURIComponent(driver.id)}">Liquidar comisión</a></dd></div>
            <div><dt>Motivo</dt><dd>${Fmt.text(driver.reviewReason)}</dd></div>
            <div><dt>Última ubicación</dt><dd>${locationLine(driver.lastLocation)}</dd></div>
            <div><dt>Viaje activo</dt><dd>${trip}</dd></div>
          </dl>
        </section>
        ${applicationBlock(driver.application, driver.status)}
        <section class="card">
          <h2>Vehículos</h2>
          <ul>${vehicles}</ul>
        </section>
        <form id="edit" class="card stack-form">
          <h2>Datos</h2>
          <div class="filters">
            <label class="field">Nombre <input name="fullName" required value="${Fmt.esc(driver.fullName || '')}"></label>
            <label class="field">Teléfono <input name="phone" required value="${Fmt.esc(driver.phone || '')}"></label>
            <label class="field">Ciudad <input name="city" required value="${Fmt.esc(driver.city || '')}"></label>
            <label class="field tight">País <input name="countryCode" maxlength="2" required value="${Fmt.esc(driver.countryCode || '')}"></label>
            <label class="field">Documento <input name="document" required value="${Fmt.esc(driver.document || '')}"></label>
          </div>
          <button class="btn" type="submit">Guardar</button>
        </form>
        <form id="review" class="card stack-form">
          <h2>Revisión</h2>
          <label class="field">Motivo
            <input name="reason" placeholder="Obligatorio para rechazar o suspender">
          </label>
          <div class="actions">
            ${approveButton}
            <button class="btn warn" type="submit" data-action="reject">Rechazar</button>
            <button class="btn danger" type="submit" data-action="suspend">Suspender</button>
          </div>
        </form>
        <form id="active" class="card stack-form">
          <h2>Actividad</h2>
          ${statusAction}
        </form>
      `;
      root.querySelector('#edit').addEventListener('submit', (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        Session.lock(form.querySelector('button'), async () => {
          try {
            render(await Api.patch(`/api/admin/drivers/${id}`, {
              fullName: form.fullName.value.trim(),
              phone: form.phone.value.trim(),
              city: form.city.value.trim(),
              countryCode: form.countryCode.value.trim().toUpperCase(),
              document: form.document.value.trim(),
            }));
            Session.toast('Datos guardados', 'ok');
          } catch (err) {
            Session.fail(err);
            if (err.errorCode === 'INVALID_STATE') load();
          }
        });
      });
      root.querySelector('#review').addEventListener('submit', (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const button = event.submitter;
        const action = button.dataset.action;
        const reason = form.reason.value.trim();
        if (action === 'approve' && driver.status === 'draft') {
          Session.toast('Un borrador no se puede aprobar');
          return;
        }
        if (action !== 'approve' && !reason) {
          Session.toast('El motivo es obligatorio');
          return;
        }
        const createsVehicle = action === 'approve' && driver.application && driver.application.vehicle;
        Session.lock(button, async () => {
          try {
            render(await Api.post(`/api/admin/drivers/${id}/review`, { action, reason }));
            Session.toast(createsVehicle ? 'Aprobado. El servidor creó el vehículo.' : 'Revisión guardada', 'ok');
          } catch (err) {
            Session.fail(err);
            if (err.errorCode === 'INVALID_STATE') load();
          }
        });
      });
      const active = root.querySelector('#active');
      active.addEventListener('submit', (event) => {
        event.preventDefault();
        const button = event.submitter;
        if (!button || !button.dataset.status) return;
        Session.lock(button, async () => {
          try {
            render(await Api.post(`/api/admin/drivers/${id}/status`, { status: button.dataset.status }));
            Session.toast('Estado actualizado', 'ok');
          } catch (err) {
            Session.fail(err);
            if (err.errorCode === 'INVALID_STATE') load();
          }
        });
      });
    }

    async function load() {
      if (!id) {
        root.innerHTML = '<p class="state">Falta el conductor.</p>';
        return;
      }
      root.innerHTML = '<p class="state">Cargando…</p>';
      try {
        render(await Api.get(`/api/admin/drivers/${id}`));
      } catch (err) {
        root.innerHTML = '<p class="state">No se pudo cargar la ficha.</p>';
        Session.fail(err);
      }
    }

    load();
  </script>
</body>
</html>
